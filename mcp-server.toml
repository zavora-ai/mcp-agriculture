risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://market-api-key"]

[[tools]]
name = "get_best_sell_time"
description = "Get recommended best time to sell based on price trends and storage costs"
risk_class = "read_only"
requires_approval = false
credential_bindings = ["vault://market-api-key"]

# ─── IoT (4) ──────────────────────────────────────────────────────────────────

[[tools]]
name = "list_sensors"
