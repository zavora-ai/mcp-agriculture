[package]
name = "mcp-agriculture"
version = "1.0.1"
edition = "2024"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Agriculture MCP Server — farm management, weather, satellite imagery, commodity markets, IoT sensors, and yield intelligence for AI agents"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-agriculture"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "agriculture", "agtech", "farming", "satellite"]
categories = ["development-tools", "api-bindings"]
readme = "README.md"

[features]
default = ["agtech", "weather", "market"]
agtech = []
weather = []
satellite = []
market = []
iot = []
all-backends = ["agtech", "weather", "satellite", "market", "iot"]

[dependencies]
adk-mcp-sdk = "0.1"
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"

[workspace]
